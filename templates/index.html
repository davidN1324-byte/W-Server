<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Web Server</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='icon/100x99.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" media="(max-width: 600px)" href="{{ url_for('static', path='mobile.css') }}">
</head>
<body>

    <div id="tokenGate" style="display:none;">
        <div class="token-form">
            <h2>Enter access token</h2>
            <div class="token-input-row">
                <input type="password" id="tokenInput" placeholder="Token"
                       onkeydown="if(event.key==='Enter') submitToken()" autofocus>
                <button id="toggleBtn" onclick="toggleTokenVisibility()" type="button">Show</button>
            </div>
            <button class="token-submit" onclick="submitToken()" type="button">Enter</button>
            <div id="tokenError" style="color:red; display:none;">Invalid token</div>
        </div>
    </div>

    <header>
        <h1>Upload File</h1>
    </header>

    <main>
        <form id="uploadForm" enctype="multipart/form-data" onsubmit="return uploadFile(event);">
            <label class="custom-file-upload">
                Select file
                <input type="file" name="file" id="fileInput" onchange="updateFileInfo()">
            </label>
            <div id="fileInfo" class="file-info" style="display:none;">
                File name: <span id="fileName"></span>
            </div>

            <div id="progressContainer" style="display: none;">
                <progress id="progressBar" value="0" max="100"></progress>
                <span id="progressText">0%</span>
            </div>

            <div id="message" style="display: none;"></div>

            <input type="submit" value="Upload">
        </form>

        <section class="file-section">
            <h2>Available files for download:</h2>
            <div class="table-container">
                <table class="file-table">
                    <thead>
                        <tr>
                            <th>File name</th>
                            <th>Size</th>
                            <th>Download</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody id="fileList"></tbody>
                </table>
            </div>
            <div id="fileStats" class="file-stats"></div>
        </section>
    </main>

    <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
